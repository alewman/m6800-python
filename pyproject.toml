[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "m6800-python"
version = "0.1.0"
description = "Readable, pure-Python Motorola MC6800 and MC6801/6803 instruction-core reference implementation"
readme = "README.md"
# The floor is the newest Python PyPy supports (3.11 as of PyPy 7.3.23); raise it when PyPy does.
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "alewman" }]
keywords = ["6800", "6802", "6803", "6808", "motorola", "cpu", "emulator", "instruction-set"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Software Development :: Libraries",
    "Topic :: System :: Emulators",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/alewman/m6800-python"
Repository = "https://github.com/alewman/m6800-python"
Changelog = "https://github.com/alewman/m6800-python/blob/main/CHANGELOG.md"
Issues = "https://github.com/alewman/m6800-python/issues"

[project.optional-dependencies]
# ruff is pinned: `ruff format --check` must see the formatter the tree was
# formatted with, or a ruff release fails CI on an unchanged tree.
dev = ["pytest>=8", "ruff==0.16.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/m6800_python"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Generated by scripts/extract_manual_tables.py --python; kept byte-identical to its output.
extend-exclude = ["tests/datasheet.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PERF", "RUF"]
# Motorola's register and flag names are upper case (A, B, X, CC, I), which
# ruff mistakes for constants (SIM300 "Yoda condition") and ambiguous names (E741).
ignore = ["SIM300", "E741"]

[tool.ruff.lint.per-file-ignores]
# The operation column is written in the manuals' notation: ∨, −, ←, ¬.
"scripts/dump_mame_tables.py" = ["RUF001"]

[tool.ruff.lint.isort]
known-first-party = ["m6800_python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The trace replays (tests/test_replays.py) take about a minute: run them with -m slow.
addopts = "--strict-markers -ra -m 'not slow'"
pythonpath = ["src", "tests", "."]
markers = ["slow: long-running replays of real code against MAME traces (pytest -m slow)"]
