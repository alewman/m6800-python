[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "m6800-python"
version = "0.1.0"
description = "Readable, pure-Python Motorola MC6800 and MC6801/6803 instruction-core reference implementation"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "alewman" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.15"]

[tool.hatch.build.targets.wheel]
packages = ["src/m6800_python"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PERF", "RUF"]
# Motorola's register and flag names are upper case (A, B, X, CC, I), which
# ruff mistakes for constants (SIM300 "Yoda condition") and ambiguous names (E741).
ignore = ["SIM300", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["m6800_python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra"
pythonpath = ["src", "tests"]
markers = ["slow: long-running tests"]
