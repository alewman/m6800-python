# What CI can run: the manual-derived tests (rung 1) and the tooling tests,
# which need nothing external. The oracle rungs need MAME 0.285, its ROM sets
# and a generated corpus, so they run locally and are recorded in
# docs/validation.md. Tests marked slow are deselected by default.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "pypy3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      # The debugger front end, end to end on a program the repository carries.
      - run: python -m m6800_python --help
