# What CI can run: the manual-derived tests (rung 1) and the tooling tests,
# which need nothing external. The oracle rungs need MAME 0.285, its ROM sets
# and a generated corpus, so they run locally and are recorded in
# docs/validation.md. Tests marked slow are deselected by default.
name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "pypy3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      # The debugger front end, end to end on a program the repository carries.
      - run: python -m m6800_python --help

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade build
      - run: python -m build --wheel --sdist
      - run: python -m pip install --force-reinstall dist/*.whl
      - name: Smoke-test the installed public API
        working-directory: ${{ runner.temp }}
        run: python ${{ github.workspace }}/scripts/smoke_installed_package.py
      - name: The wheel carries the typing marker
        run: python -c "import zipfile, glob; names = zipfile.ZipFile(glob.glob('dist/*.whl')[0]).namelist(); assert 'm6800_python/py.typed' in names, names"
